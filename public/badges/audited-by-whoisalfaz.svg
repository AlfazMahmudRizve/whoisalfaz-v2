<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 28" width="190" height="28" role="img" aria-label="Audited by whoisalfaz">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="190" height="28" rx="6" fill="url(#bg)" stroke="#1e293b" stroke-width="1" />
  <rect x="0.5" y="0.5" width="189" height="27" rx="5.5" fill="none" stroke="#14b8a6" stroke-opacity="0.3" stroke-width="1" />

  <!-- Left Icon Accent: Shield / Checkmark -->
  <circle cx="15" cy="14" r="7.5" fill="#042f2e" stroke="#0d9488" stroke-width="1" />
  <path d="M11.5 14l2.5 2.5 4.5-4.5" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Divider -->
  <line x1="28" y1="6" x2="28" y2="22" stroke="#334155" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Typography -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- "AUDITED BY" -->
    <text x="34" y="17.5" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#94a3b8" text-transform="uppercase">AUDITED BY</text>
    
    <!-- "whoisalfaz" -->
    <text x="101" y="17.5" font-size="11" font-weight="700" letter-spacing="-0.2">
      <tspan fill="#f1f5f9">whois</tspan><tspan fill="url(#brandGrad)" font-weight="800">alfaz</tspan>
    </text>
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="177" cy="14" r="2.5" fill="#10b981" />
  <circle cx="177" cy="14" r="4.5" fill="none" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
</svg>
